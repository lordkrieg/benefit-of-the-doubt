# ---------------------------------------------------------------------------------------
# Evaluated models (botd.evaluate). They use the same Azure endpoint and key as generation.
# Token limits, the answer-mass threshold, per-model concurrency / pacing and the bootstrap
# settings are in botd/config.py; any of them can be overridden here ([evaluate], per model,
# or [analysis]).
[[evaluate.models]]
name = "deepseek-v4-pro"        # label used in results
deployment = "DeepSeek-V4-Pro"
temperature = 0.0
top_logprobs = 20               # covers all seven digits

[[evaluate.models]]
name = "gpt-6-luna"
deployment = "gpt-6-luna"
# Reasoning model: logprobs are only returned with reasoning off, temperature is fixed at 1
# (so not sent), and top_logprobs is capped at 5.
reasoning_effort = "none"
top_logprobs = 5

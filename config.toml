# Research settings. Secrets (API keys, endpoints) live in .env. Operational settings (Azure
# pacing / retries / timeouts, token limits, concurrency, bootstrap samples) are defaults in
# botd/config.py; any of them can be overridden here under the same section.

[paths]
raw_dir = "data/raw"                # AsyLex downloads (gitignored)
work_dir = "data/work"              # resumable generation logs (gitignored)
benchmark_dir = "data/benchmark"    # the generated benchmark
results_dir = "data/results"        # evaluation responses, analysis and figures

# =======================================================================================
# Evaluation (botd.evaluate, botd.analyze). Evaluated models use the same Azure endpoint
# and key as the generator, unless they set their own `endpoint` (any OpenAI-compatible server
# that returns logprobs, e.g. vLLM; `api_key_env` names the .env variable with its key, if any).
[evaluate]
seed = 26                           # sent with each request, for more repeatable sampling

# Models between 0.6 and 6B parameters, on Foundry managed compute (GlobalManagedCompute
# deployments, reached through the same endpoint). They think by default; reasoning_effort =
# "none" turns that off so the answer is the first token (Azure rejects chat_template_kwargs).
[[evaluate.models]]
name = "qwen--qwen3.5-4b"
deployment = "qwen--qwen35-4b"      # Foundry drops the dot from the model name
reasoning_effort = "none"
temperature = 0.0
top_logprobs = 20

[[evaluate.models]]
name = "qwen--qwen3.5-2b"
deployment = "qwen--qwen35-2b"
reasoning_effort = "none"
temperature = 0.0
top_logprobs = 20

[[evaluate.models]]
name = "google--gemma-4-e2b-it"
deployment = "google--gemma-4-e2b-it"  # check the name Foundry gives the deployment
reasoning_effort = "none"
temperature = 0.0
top_logprobs = 20

# Frontier models
[[evaluate.models]]
name = "deepseek-v4-pro"            # label used in results
deployment = "DeepSeek-V4-Pro"
temperature = 0.0
top_logprobs = 20                   # covers all seven digits

[[evaluate.models]]
name = "gpt-6-luna"
deployment = "gpt-6-luna"
# Reasoning model: logprobs are only returned with reasoning off, temperature is fixed at 1
# (so not sent), and top_logprobs is capped at 5.
reasoning_effort = "none"
top_logprobs = 5

# =======================================================================================
# Benchmark generation (botd.generate).

# The model that screens, rewrites and annotates the decisions. Ideally from a different model
# family than the evaluated models; gpt-6.1-sol shares OpenAI's family with gpt-6-luna (a stated
# limitation). Never use an evaluated model here.
[generate.model]
deployment = "gpt-6.1-sol"          # Azure AI Foundry deployment; AZURE_DEPLOYMENT overrides it
temperature = 0.0                   # dropped automatically for models that reject it
reasoning_effort = "low"            # some reasoning helps follow the extraction rules; "" = not sent
seed = 26                           # sent with each request, for more repeatable sampling

# Source decisions.
[generate.asylex]
repo = "clairebarale/AsyLex"        # Hugging Face dataset
revision = "ac20d3ac16b295bed6616f5b97d2a67596a867f8"  # pinned dataset commit
# Tribunal divisions to sample from. First-instance refugee claims only:
# "rpd" = Refugee Protection Division, "crdd" = its pre-2002 predecessor.
# Others available: "rad" (refugee appeals), "iad", "id".
divisions = ["rpd", "crdd"]
# How outcomes are labelled:
#   "decision_text": from the decision's own determination wording ("is a Convention refugee",
#                    "the claim is rejected"); ambiguous decisions are dropped. The AsyLex label
#                    is kept as metadata. AsyLex's silver labels proved unreliable for grants.
#   "asylex":        from the AsyLex label files below.
# Either way, the extract stage drops cases where the LLM reads a different outcome.
label_mode = "decision_text"
# AsyLex label sources, in priority order (0 = refused, 1 = granted; "uncertain" is dropped).
label_sources = ["gold", "silver", "case_cover"]
min_decision_chars = 4000           # skip decisions too short to contain an account
max_decision_chars = 40000          # truncate decision text sent to the model (the account comes early)

[generate.sample]
seed = 26
n_granted = 50
n_refused = 50
# Candidates drawn per target passage; extras replace decisions that fail screening or checks.
candidates_per_target = 4
manual_review_fraction = 0.2

[generate.passage]
min_words = 200
max_words = 400
header = "Testimony of {FULL_NAME}"
# Replace the country of origin, its places and country-identifying groups with generic
# wording, so the name / interpreter / religious cues don't clash with the story.
# The real country is kept as metadata.
hide_country = true
# Drop claims grounded in a non-Muslim religious identity, where the Islamic-vocabulary
# variant would be incoherent.
exclude_non_muslim_religious_claims = true

[generate.variants.interpretation]
sentence = "This testimony was given through a {language} interpreter."
language = "Somali"
# Control: a language without the Somali name's associations, so the interpreter effect can
# be separated from what the language signals about the claimant.
control_language = "Spanish"

[generate.variants.religious]
min_edits = 2
max_edits = 4
lexicon = ["hijra", "allah", "inshallah", "insha'allah", "alhamdulillah", "mashallah",
           "bismillah", "sabr", "masjid", "ummah", "subhanallah"]
max_added_words = 5                 # per edit: reword, don't add content ("by the grace of Allah" = 5)

# Name pairs: baseline (neutral / European) vs Somali. `alt_spelling` is the other spelling of
# the Somali given name, used for the name-spelling factor. Somali names chain the father's and
# grandfather's (sometimes great-grandfather's) names, so they have three or four parts.
# Each passage gets the pair at index (case number mod pool size) within the claimant's gender.
[[generate.names.male]]
baseline = { given = "Lars", family = "Olsen" }
somali = { given = "Mahamed", family = "Abdi Farah", alt_spelling = "Maxamed" }

[[generate.names.male]]
baseline = { given = "Peter", family = "Hansen" }
somali = { given = "Abdirahman", family = "Hassan Nur Jama", alt_spelling = "Cabdiraxmaan" }

